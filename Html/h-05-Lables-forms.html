<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-In-Html</title>
</head>
<body>
    <!--- Forms in html is used to store the data and collect it from the user -->
    <form action="/action.php">
        
        <!--- 1st Form element = INPUT -->
        <!--- Below is the syntax to use the input tag -->
        <!--- Place holder meand that what will be written in the inside of it on the website -->
        <p><b>Input Tag Use</b></p>

        <input type="text" placeholder="Username">
        <br>
        <input type="password" placeholder="Password">

        <br>
        <!-- Use of labels -->
         <p><b>Use of Labels </b></p>
         <!--Labels 1 = Radio Button -->
         <br>
         <label for="1">
         <input type="radio" value="Class X12" name="class" id="1"> Class X12   <!-- Important to note that the value and the one you are printing should be in sync to the user-->
         </label>
         
         <br>
         
         <label for="2">
         <input type="radio" value="Class X10" name="class" id="2"> Class X10
         </label>



    </form>
    
</body>
</html>
