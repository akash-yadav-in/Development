<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Page Layout Techniques -->
    <!-- Sementic (We can understand by seeing the name of the tag) Non-Scementic (we cannot understand by seeing example div , span )-->

    <!-- 1 -  is  Header Part -->
    <header>
        <p>--- Portfolio ---</p>
    </header>
    <main>
         <!-- M-1 -  is  Section Tag -->
          <section>Education : Secondar school </section>


         <!-- M-2 -  is  Article Tag -->
          <article>My Experiences | My Journey </article>
         
         
          <!-- M-3 -  is  Aside Tag for ads on website -->
          <aside>This is an ad</aside>
          <br/>
          <br/>

           <!-- M-4 -  is  Revisiting Anchor Tag -->

            <!-- Target main is basically now then clicking github it will open in new tab -->
            <a href="https://github.com/akash-yadav-in" target="_main">Github</a>
            <br/>
            <br/>


            <!-- Below is the way we can make our pictures to bi clickable -->
            <a href="https://github.com/akash-yadav-in"><img src="https://cdn-icons-png.flaticon.com/256/25/25231.png" alt="Github_Image"></a>

          <div> <!-- Div Act as a container and the cover the whole width -->
            
            <p>Hello, I am div tag</p>
          </div>

          <!-- Span tags(here only that space is considereed which is required for that element)-->
           <span>Hello, Welcome to this website</span>

           

        </main>

     <!-- 2 -  is  Footer Part -->
    <footer>
        <h5>Contact !! Here !!</h5>
    </footer>

  
</body>

</html>
